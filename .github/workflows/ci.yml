name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Bootstrap replaces placeholders, renames src/project_name/, and runs uv sync --dev
      - name: Bootstrap test project
        run: python bootstrap.py --name "Test Project" --author "CI Bot" --skip-git

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ evals/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ evals/ -m "not llm" --tb=short -v --cov=src --cov-report=term-missing

      - name: Coverage gate
        run: uv run pytest tests/ evals/ -m "not llm" --cov=src --cov-fail-under=80

      - name: Frontend tests
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run test -- --run
        working-directory: frontend
